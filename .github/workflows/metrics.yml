name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Main Metrics & Isometric Calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: 5krm
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Riyadh
          filename: github-metrics.svg
          
          # Isometric 3D Calendar (Image 2)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          
          # Habits & Activity (Image 2)
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          
          # Tech Stack & Languages (Image 1 & 2)
          plugin_languages: yes
          plugin_languages_analysis_details: yes
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_sections: most-used
          plugin_languages_indepth: yes

          # Topics and Mastered Technologies
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 20
